name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Change this to 'master' if your main branch is named master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Secrets
        run: |
          # Replace the placeholder with a script tag containing your secrets
          CONFIG_SCRIPT="<script>var __firebase_config = \`$FIREBASE_CONFIG_JSON\`; var __app_id = '$REMOTE_APP_ID';</script>"
          sed -i "s|<!-- CONFIG_INJECTION -->|$CONFIG_SCRIPT|g" index.html
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          REMOTE_APP_ID: ${{ secrets.REMOTE_APP_ID }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
